<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projection Output</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #gl-canvas {
      width: 100%; height: 100%;
      display: block;
    }
    #clickStart {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000;
      color: #fff;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    }
    #clickStart h1 {
      font-size: 28px;
      letter-spacing: 4px;
      font-weight: 700;
      border: 2px solid rgba(255,255,255,0.6);
      padding: 16px 32px;
      border-radius: 8px;
    }
    #clickStart p {
      margin-top: 16px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <div id="clickStart">
    <h1>CLICK TO PROJECT</h1>
    <p>This window shows only your content — no buttons, no text.</p>
  </div>
  <script type="module" src="/src/output.ts"></script>
</body>
</html>
