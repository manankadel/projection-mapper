<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Graffiti Wall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    #toolbar {
      position: fixed; top: 50%; right: 20px; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px; z-index: 10;
      opacity: 0; transition: opacity 0.4s;
    }
    body:hover #toolbar { opacity: 1; }
    .tool-btn {
      width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font: 14px sans-serif; transition: all 0.15s; backdrop-filter: blur(8px);
    }
    .tool-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .tool-btn.active { background: rgba(255,100,50,0.2); border-color: rgba(255,100,50,0.5); color: #ff6432; }
    .color-swatch {
      width: 44px; height: 44px; border-radius: 12px; border: 2px solid transparent;
      cursor: pointer; transition: all 0.15s;
    }
    .color-swatch.active { border-color: #fff; transform: scale(1.1); }
    #size-slider {
      width: 44px; height: 80px; -webkit-appearance: none; appearance: none;
      background: transparent; cursor: pointer;
    }
    #size-slider::-webkit-slider-runnable-track {
      width: 4px; height: 100%; background: rgba(255,255,255,0.2); border-radius: 2px;
    }
    #size-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; margin-left: -6px; margin-top: -6px;
    }
    #bottom-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s; z-index: 10;
    }
    body:hover #bottom-bar { opacity: 1; }
    .btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); padding: 8px 18px; border-radius: 20px;
      font: 12px/1 'Inter', system-ui, sans-serif; cursor: pointer;
      transition: all 0.2s; backdrop-filter: blur(8px);
    }
    .btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    #mode-label {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      font: 12px 'Inter', sans-serif; color: rgba(255,255,255,0.3); opacity: 0; transition: opacity 0.4s;
    }
    body:hover #mode-label { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="mode-label">Brush</div>
  <div id="toolbar">
    <div class="tool-btn active" data-tool="brush" title="Brush">&#9998;</div>
    <div class="tool-btn" data-tool="spray" title="Spray Can">&#127752;</div>
    <div class="tool-btn" data-tool="neon" title="Neon">&#9889;</div>
    <div class="tool-btn" data-tool="eraser" title="Eraser">&#9003;</div>
    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:4px 0">
    <div class="color-swatch active" style="background:#ff3366" data-color="#ff3366"></div>
    <div class="color-swatch" style="background:#00d4ff" data-color="#00d4ff"></div>
    <div class="color-swatch" style="background:#33ff88" data-color="#33ff88"></div>
    <div class="color-swatch" style="background:#ffaa00" data-color="#ffaa00"></div>
    <div class="color-swatch" style="background:#aa55ff" data-color="#aa55ff"></div>
    <div class="color-swatch" style="background:#ffffff" data-color="#ffffff"></div>
    <div class="color-swatch" style="background:#ff6600" data-color="#ff6600"></div>
    <div class="color-swatch" style="background:#00ffaa" data-color="#00ffaa"></div>
    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:4px 0">
    <input type="range" id="size-slider" min="2" max="60" value="12">
  </div>
  <div id="bottom-bar">
    <button class="btn" id="undo-btn">Undo</button>
    <button class="btn" id="clear-btn">Clear</button>
    <button class="btn" id="save-btn">Save PNG</button>
    <button class="btn" id="fs-btn">Fullscreen</button>
  </div>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  // Save current content
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  ctx.putImageData(imageData, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
window.addEventListener('resize', resize);
resize();

let tool = 'brush';
let color = '#ff3366';
let size = 12;
let drawing = false;
let lastX = 0, lastY = 0;
let undoStack = [];
let maxUndo = 30;

function saveState() {
  if (undoStack.length >= maxUndo) undoStack.shift();
  undoStack.push(canvas.toDataURL());
}

// Save initial state
saveState();

const modeLabel = document.getElementById('mode-label');
const modeNames = { brush: 'Brush', spray: 'Spray Can', neon: 'Neon', eraser: 'Eraser' };

document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
    modeLabel.textContent = modeNames[tool];
  });
});

document.querySelectorAll('[data-color]').forEach(swatch => {
  swatch.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('[data-color]').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    color = swatch.dataset.color;
  });
});

document.getElementById('size-slider').addEventListener('input', e => {
  size = parseInt(e.target.value);
});

canvas.addEventListener('mousedown', e => {
  if (e.target.closest('#toolbar') || e.target.closest('#bottom-bar')) return;
  drawing = true;
  lastX = e.clientX;
  lastY = e.clientY;
  saveState();
});

canvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  const x = e.clientX, y = e.clientY;

  if (tool === 'brush') {
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.globalAlpha = 0.9;
    ctx.globalCompositeOperation = 'source-over';
    ctx.stroke();
  } else if (tool === 'spray') {
    const density = size * 2;
    ctx.globalAlpha = 0.15;
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < density; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * size;
      const sx = x + Math.cos(angle) * radius;
      const sy = y + Math.sin(angle) * radius;
      ctx.fillStyle = color;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  } else if (tool === 'neon') {
    // Glow layers
    const dist = Math.hypot(x - lastX, y - lastY);
    const steps = Math.max(1, Math.floor(dist / 2));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const px = lastX + (x - lastX) * t;
      const py = lastY + (y - lastY) * t;

      // Outer glow
      ctx.beginPath();
      ctx.arc(px, py, size * 3, 0, Math.PI * 2);
      const glow = ctx.createRadialGradient(px, py, 0, px, py, size * 3);
      glow.addColorStop(0, color + '44');
      glow.addColorStop(0.5, color + '11');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5;
      ctx.fill();

      // Core
      ctx.beginPath();
      ctx.arc(px, py, size * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = 0.9;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      const core = ctx.createRadialGradient(px, py, 0, px, py, size);
      core.addColorStop(0, '#ffffff');
      core.addColorStop(0.3, color);
      core.addColorStop(1, 'transparent');
      ctx.fillStyle = core;
      ctx.globalAlpha = 0.7;
      ctx.fill();
    }
  } else if (tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.lineWidth = size * 3;
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  lastX = x;
  lastY = y;
});

canvas.addEventListener('mouseup', () => { drawing = false; });
canvas.addEventListener('mouseleave', () => { drawing = false; });

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  drawing = true;
  lastX = t.clientX;
  lastY = t.clientY;
  saveState();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drawing) return;
  const t = e.touches[0];
  const mouseEvent = new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY });
  canvas.dispatchEvent(mouseEvent);
}, { passive: false });
canvas.addEventListener('touchend', () => { drawing = false; });

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'b') { document.querySelector('[data-tool="brush"]').click(); }
  if (e.key === 's') { document.querySelector('[data-tool="spray"]').click(); }
  if (e.key === 'n') { document.querySelector('[data-tool="neon"]').click(); }
  if (e.key === 'e') { document.querySelector('[data-tool="eraser"]').click(); }
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    undo();
  }
});

function undo() {
  if (undoStack.length > 0) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = undoStack.pop();
  }
}

document.getElementById('undo-btn').addEventListener('click', e => { e.stopPropagation(); undo(); });
document.getElementById('clear-btn').addEventListener('click', e => {
  e.stopPropagation();
  saveState();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});
document.getElementById('save-btn').addEventListener('click', e => {
  e.stopPropagation();
  const link = document.createElement('a');
  link.download = 'graffiti-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
});
document.getElementById('fs-btn').addEventListener('click', e => {
  e.stopPropagation();
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});
</script>
</body>
</html>
