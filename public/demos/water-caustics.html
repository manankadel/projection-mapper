<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Caustics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; cursor: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s; z-index: 10;
    }
    body:hover #ui { opacity: 1; }
    .btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); padding: 8px 18px; border-radius: 20px;
      font: 12px/1 'Inter', system-ui, sans-serif; cursor: pointer;
      transition: all 0.2s; backdrop-filter: blur(8px);
    }
    .btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .btn.active { background: rgba(0,150,255,0.2); border-color: rgba(0,150,255,0.5); color: #00aaff; }
    #fps { position: fixed; top: 20px; left: 20px; z-index: 10;
      font: 11px 'SF Mono', monospace; color: rgba(255,255,255,0.2); opacity: 0; transition: opacity 0.4s; }
    body:hover #fps { opacity: 1; }
    #info { position: fixed; top: 20px; right: 20px; z-index: 10;
      font: 11px/1.4 'Inter', sans-serif; color: rgba(255,255,255,0.3); text-align: right;
      opacity: 0; transition: opacity 0.4s; }
    body:hover #info { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fps"></div>
  <div id="info">Water Caustics<br>Move mouse to shift depth<br>Click to fullscreen</div>
  <div id="ui">
    <button class="btn active" data-p="deep">Deep Ocean</button>
    <button class="btn" data-p="pool">Pool</button>
    <button class="btn" data-p="tropical">Tropical</button>
    <button class="btn" data-p="moonlit">Moonlit</button>
  </div>
<script>
"use strict";
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:40px">WebGL2 required</p>'; throw new Error('No WebGL2'); }

let W, H;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const presets = {
  deep:    { bg: [0.0, 0.02, 0.06], caustic: [0.0, 0.3, 0.6], accent: [0.0, 0.6, 0.9], speed: 0.3, depth: 1.0, contrast: 1.2 },
  pool:    { bg: [0.0, 0.05, 0.12], caustic: [0.2, 0.7, 1.0], accent: [0.4, 0.9, 1.0], speed: 0.4, depth: 0.7, contrast: 1.5 },
  tropical: { bg: [0.0, 0.08, 0.15], caustic: [0.1, 0.8, 0.7], accent: [0.0, 1.0, 0.9], speed: 0.35, depth: 0.5, contrast: 1.3 },
  moonlit: { bg: [0.01, 0.01, 0.04], caustic: [0.3, 0.3, 0.5], accent: [0.5, 0.5, 0.8], speed: 0.2, depth: 1.2, contrast: 1.0 },
};

let current = { ...presets.deep, bg: [...presets.deep.bg], caustic: [...presets.deep.caustic], accent: [...presets.deep.accent] };
let target = presets.deep;
let mouseX = 0.5, mouseY = 0.5;

document.addEventListener('mousemove', e => { mouseX = e.clientX / W; mouseY = e.clientY / H; });
document.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
});
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    target = presets[b.dataset.p];
  });
});

const vs = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main() { v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const fs = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;
uniform float u_time;
uniform vec2 u_mouse;
uniform vec3 u_bg;
uniform vec3 u_caustic;
uniform vec3 u_accent;
uniform float u_speed;
uniform float u_depth;
uniform float u_contrast;

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 perm(vec4 x){return mod289(((x*34.)+1.)*x);}

float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);
  const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=perm(perm(perm(
    i.z+vec4(0.,i1.z,i2.z,1.))
  +i.y+vec4(0.,i1.y,i2.y,1.))
  +i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;
  vec4 s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
  m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

float caustic(vec2 uv, float t) {
  vec3 p = vec3(uv * 3.0, t);
  float c = 0.0;
  c += snoise(p) * 0.5;
  c += snoise(p * 2.0 + vec3(1.7, 3.2, 0.5)) * 0.25;
  c += snoise(p * 4.0 + vec3(5.1, 2.8, 1.3)) * 0.125;
  c += snoise(p * 8.0 + vec3(3.4, 6.1, 4.7)) * 0.0625;

  // Sharpen caustics
  c = pow(abs(c), 1.5) * u_contrast;
  return clamp(c, 0.0, 1.0);
}

void main() {
  vec2 uv = v_uv;
  float t = u_time * u_speed;
  float mx = (u_mouse.x - 0.5) * 0.3;
  float my = (u_mouse.y - 0.5) * 0.2;

  // Water depth gradient
  float depth = mix(0.5, 1.5, uv.y + my);
  vec3 bgColor = u_bg * (1.0 + depth * 0.3);

  // Caustic layers at different depths
  float c1 = caustic(uv + vec2(mx * 0.3, 0.0), t);
  float c2 = caustic(uv * 1.3 + vec2(0.5, 0.3) + vec2(-mx * 0.2, my * 0.2), t * 0.8 + 1.5);
  float c3 = caustic(uv * 0.8 + vec2(-0.3, 0.7) + vec2(mx * 0.1, -my * 0.1), t * 0.6 + 3.0);

  // Combine layers with depth fade
  float combined = (c1 * 0.6 + c2 * 0.3 + c3 * 0.1);
  combined = pow(combined, 1.2);

  // Color mixing
  vec3 causticColor = mix(u_caustic, u_accent, c2 * 0.5);
  vec3 color = bgColor + causticColor * combined * u_depth;

  // Subtle light rays from top
  float rays = 0.0;
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    float x = uv.x * 2.0 - 1.0 + mx * 0.5 + fi * 0.3;
    float ray = exp(-x * x * (2.0 + fi * 0.5)) * exp(-uv.y * (1.5 + fi * 0.3));
    ray *= snoise(vec3(uv.x * 3.0 + fi, uv.y * 2.0, t * 0.3 + fi)) * 0.5 + 0.5;
    rays += ray * 0.15;
  }
  color += u_accent * rays * 0.3;

  // Subtle ripple lines
  float ripple = snoise(vec3(uv * 10.0, t * 0.5));
  ripple = smoothstep(0.3, 0.5, abs(ripple)) * 0.05;
  color += vec3(ripple) * u_caustic;

  // Vignette
  float vig = 1.0 - dot(uv - 0.5, uv - 0.5) * 0.6;
  color *= vig;

  // Tone mapping
  color = color / (color + vec3(1.0));
  color = pow(color, vec3(1.0 / 2.2));

  fragColor = vec4(color, 1.0);
}`;

function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(vs, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(fs, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const u = {
  time: gl.getUniformLocation(prog, 'u_time'),
  mouse: gl.getUniformLocation(prog, 'u_mouse'),
  bg: gl.getUniformLocation(prog, 'u_bg'),
  caustic: gl.getUniformLocation(prog, 'u_caustic'),
  accent: gl.getUniformLocation(prog, 'u_accent'),
  speed: gl.getUniformLocation(prog, 'u_speed'),
  depth: gl.getUniformLocation(prog, 'u_depth'),
  contrast: gl.getUniformLocation(prog, 'u_contrast'),
};

const startTime = performance.now();
let frames = 0, lastFT = startTime;
const fpsEl = document.getElementById('fps');

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpA(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }

function render(now) {
  requestAnimationFrame(render);
  const t = (now - startTime) * 0.001;
  const s = 0.02;

  current.bg = lerpA(current.bg, target.bg, s);
  current.caustic = lerpA(current.caustic, target.caustic, s);
  current.accent = lerpA(current.accent, target.accent, s);
  current.speed = lerp(current.speed, target.speed, s);
  current.depth = lerp(current.depth, target.depth, s);
  current.contrast = lerp(current.contrast, target.contrast, s);

  gl.uniform1f(u.time, t);
  gl.uniform2f(u.mouse, mouseX, mouseY);
  gl.uniform3fv(u.bg, current.bg);
  gl.uniform3fv(u.caustic, current.caustic);
  gl.uniform3fv(u.accent, current.accent);
  gl.uniform1f(u.speed, current.speed);
  gl.uniform1f(u.depth, current.depth);
  gl.uniform1f(u.contrast, current.contrast);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  frames++;
  if (now - lastFT >= 1000) {
    fpsEl.textContent = frames + ' FPS';
    frames = 0;
    lastFT = now;
  }
}
requestAnimationFrame(render);
</script>
</body>
</html>
