<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface2: #1a1a1a; --surface3: #222;
      --border: #2a2a2a; --text: #e0e0e0; --text-dim: #888; --text-muted: #555;
      --accent: #00d4ff; --accent2: #ff3366; --accent3: #33ff88; --accent4: #ffaa00;
      --accent5: #aa55ff;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
    .header h1 { font-size: 24px; margin-bottom: 4px; }
    .header h1 span { color: var(--accent); }
    .header p { color: var(--text-dim); font-size: 13px; }
    .controls { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
    .search { flex: 1; min-width: 200px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 14px; }
    .search:focus { outline: none; border-color: var(--accent); }
    .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.15s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .stats { display: flex; gap: 24px; padding: 12px 32px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-dim); }
    .stats .count { color: var(--accent); font-weight: 600; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; padding: 24px 32px; max-width: 1600px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: all 0.2s; cursor: pointer; position: relative; overflow: hidden; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.08); }
    .card.selected { border-color: var(--accent3); background: rgba(51,255,136,0.05); }
    .card .cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
    .card h3 { font-size: 15px; margin-bottom: 6px; line-height: 1.3; }
    .card p { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .card .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .card .tag { font-size: 10px; background: var(--surface3); color: var(--text-muted); padding: 3px 8px; border-radius: 4px; }
    .card .check { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; }
    .card.selected .check { background: var(--accent3); border-color: var(--accent3); color: #000; }
    .cat-art { color: var(--accent2); } .cat-gaming { color: var(--accent3); } .cat-events { color: var(--accent4); }
    .cat-retail { color: var(--accent5); } .cat-edu { color: #44aaff; } .cat-food { color: #ff8844; }
    .cat-home { color: #ff66aa; } .cat-health { color: #44ffaa; } .cat-corp { color: #8888ff; }
    .cat-social { color: #ff4488; } .cat-music { color: #ffaa44; } .cat-arch { color: #44dddd; }
    .cat-science { color: #66ff66; } .cat-security { color: #ff6644; } .cat-transport { color: #4488ff; }
    .cat-fashion { color: #ff88cc; } .cat-industrial { color: #aaaa44; } .cat-environment { color: #44cc88; }
    .cat-accessibility { color: #cc88ff; } .cat-sports { color: #ff5555; } .cat-cv { color: #55ccff; }
    .cat-dataviz { color: #88ffaa; } .cat-religious { color: #ddaa44; } .cat-cultural { color: #cc6644; }
    .cat-nature { color: #66cc44; } .cat-creative { color: #ff66cc; } .cat-smarthome { color: #44aaff; }
    .cat-military { color: #888866; } .cat-marine { color: #4488cc; } .cat-space { color: #aa88ff; }
    .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .action-bar .selected-count { font-size: 14px; color: var(--accent3); font-weight: 600; }
    .action-bar button { padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #33ddff; }
    .btn-secondary { background: var(--surface3); color: var(--text); margin-right: 8px; }
    .btn-secondary:hover { background: #333; }
    #results-info { padding: 8px 32px; font-size: 13px; color: var(--text-dim); background: var(--bg); }
    .empty { text-align: center; padding: 80px 32px; color: var(--text-muted); }
    .empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text-dim); }
  </style>
</head>

<script>
const CASES = [
// === ART & INSTALLATION (50) ===
{id:1,cat:"art",title:"Reactive Wall — Touch-Responsive Light Painting",desc:"Wall-sized installation where touching/pressing creates glowing ripples of color that spread and fade. Uses depth camera or capacitive sensors.",tags:["interactive","wall","sensor","glow"]},
{id:2,cat:"art",title:"Infinite Mirror Portal",desc:"Project depth illusions onto a mirror frame creating an endless corridor effect. Content recedes into infinity as viewer approaches.",tags:["mirror","depth","illusion","portal"]},
{id:3,cat:"art",title:"Kinetic Sand Table — Flowing Terrain",desc:"Real-time projected terrain that shifts like liquid sand on a physical sand table. Hands reshape the sand, projections follow the contours.",tags:["sand","terrain","hands","flow"]},
{id:4,cat:"art",title:"Bioluminescent Forest Floor",desc:"Walk across a dark floor and each step triggers bioluminescent mushroom/flower blooms that pulse and spread with footstep timing.",tags:["floor","footsteps","bio","glow"]},
{id:5,cat:"art",title:"Data Rain — Live Social Feed Visualization",desc:"Tweets/posts cascade down a wall as glowing rain drops. Each drop contains text, profile pic, sentiment color-coded.",tags:["data","social","rain","realtime"]},
{id:6,cat:"art",title:"Fractal Zoom Infinite Canvas",desc:"Seamless fractal zoom mapped across an entire room. Viewer position controls zoom depth via webcam tracking.",tags:["fractal","zoom","tracking","immersive"]},
{id:7,cat:"art",title:"Particle Symphony — Sound-Reactive Particles",desc:"Thousands of particles dance to ambient sound/music. Bass creates explosions, treble creates sparkles, mids create flowing ribbons.",tags:["particles","sound","music","reactive"]},
{id:8,cat:"art",title:"Water Caustics on Ceiling",desc:"Realistic underwater caustic light patterns projected onto ceiling, creating the illusion of being submerged. Syncs with ambient audio.",tags:["water","caustics","ceiling","underwater"]},
{id:9,cat:"art",title:"Gravity Well Visualization",desc:"Physical sphere on table creates a projected gravity well around it. Rolling balls orbit the sphere with realistic physics.",tags:["physics","gravity","sphere","orbits"]},
{id:10,cat:"art",title:"Painting Come Alive — Frame Animation",desc:"Static painting in a frame is augmented with animated elements — birds fly, water flows, clouds drift — projected precisely onto the canvas.",tags:["painting","frame","animation","augmented"]},
{id:11,cat:"art",title:"Audience Particle Swarm",desc:"Each audience member becomes a particle in a swarm. Movement tracked, particles follow people, creating collective art.",tags:["audience","swarm","tracking","collective"]},
{id:12,cat:"art",title:"Liquid Color Pour — Real-time Fluid Sim",desc:"Virtual liquid pours, mixes, and splashes across a surface. Touch or sound triggers pours. Colors blend realistically.",tags:["fluid","liquid","color","simulation"]},
{id:13,cat:"art",title:"Constellation Map — Personal Star Chart",desc:"Enter your birthday, a custom star map is generated and projected onto a dome or wall. Stars twinkle, constellations draw themselves.",tags:["stars","constellation","personal","dome"]},
{id:14,cat:"art",title:"Morphing Sculpture — 3D Shape Shifting",desc:"Projected 3D forms continuously morph between organic shapes — blob to cube to sphere — with realistic lighting and shadows.",tags:["3d","morph","shape","organic"]},
{id:15,cat:"art",title:"Emotion Mirror — Face-Tracked Color Aura",desc:"Webcam captures face, AI detects emotion, projected aura around your reflection changes color/shape based on mood.",tags:["face","emotion","mirror","aura"]},
{id:16,cat:"art",title:"Digital Graffiti Wall",desc:"Full wall becomes a graffiti canvas. Draw, spray, tag with virtual paint. Multiple users collaborate in real-time.",tags:["graffiti","wall","draw","collaborative"]},
{id:17,cat:"art",title:"Clock of Seasons — Year-Long Animation",desc:"A projected clock where each hour shows a different season. Hands move in real-time, background shifts through spring→summer→fall→winter.",tags:["clock","seasons","time","ambient"]},
{id:18,cat:"art",title:"Topographic Landscape — Living Map",desc:"Physical terrain model with projected contour lines, waterways, vegetation that shift and change. Weather system above.",tags:["topography","terrain","map","weather"]},
{id:19,cat:"art",title:"Breath-Driven Nebula",desc:"Microphone captures breathing rhythm. Slow breath = expanding nebula. Fast breath = collapsing star. Creates meditative feedback loop.",tags:["breath","nebula","meditation","mic"]},
{id:20,cat:"art",title:"Shadow Puppet Theater — Hand Tracking",desc:"Hands create shadow puppets on wall, but projections enhance them with color, texture, animation. Dragon breathes fire, bird has feathers.",tags:["shadow","puppets","hands","enhanced"]},
{id:21,cat:"art",title:"Neural Network Visualization",desc:"Real-time visualization of an AI neural network processing data. Neurons fire, layers activate, data flows through the network visually.",tags:["ai","neural","network","visualization"]},
{id:22,cat:"art",title:"Urban Canvas — Building Facade Art",desc:"Entire building facade becomes a dynamic art canvas. Abstract patterns, social messages, or commissioned art pieces cycle through.",tags:["building","facade","urban","canvas"]},
{id:23,cat:"art",title:"Sound Sculpture — Audio波形 3D",desc:"Microphone input creates 3D waveform sculptures in real-time. Different frequencies create different shapes. Walk around the sculpture.",tags:["sound","3d","waveform","sculpture"]},
{id:24,cat:"art",title:"Digital Terrarium — Living Ecosystem",desc:"Projected miniature ecosystem in a glass bowl. Creatures interact, plants grow, weather changes. Fully autonomous simulation.",tags:["ecosystem","terrarium","simulation","living"]},
{id:25,cat:"art",title:"Perspective Illusion Room",desc:"Entire room painted with projected forced perspective. Walking through creates impossible architecture — stairs going up that are flat, doors to nowhere.",tags:["perspective","illusion","room","impossible"]},
{id:26,cat:"art",title:"Aurora Borealis Ceiling",desc:"Realistic northern lights projected onto bedroom ceiling. Colors shift, curtains of light dance, synced to music or time of day.",tags:["aurora","ceiling","northern","ambient"]},
{id:27,cat:"art",title:"Kinetic Typography Wall",desc:"Words and sentences float, bounce, and rearrange themselves on a wall. Responds to voice input — speak and watch text react.",tags:["typography","text","voice","kinetic"]},
{id:28,cat:"art",title:"Pixel Rain Matrix Effect",desc:"Classic Matrix digital rain on any surface. Customize colors, speed, character sets. Supports Arabic, Kanji, custom alphabets.",tags:["matrix","rain","digital","code"]},
{id:29,cat:"art",title:"Warp Bubble — Personal Distortion Field",desc:"Stand in front and the space around you warps and bends. Your silhouette creates a distortion field that warps the projected environment.",tags:["warp","distortion","silhouette","personal"]},
{id:30,cat:"art",title:"Time Lapse Accelerator",desc:"Projected time-lapse that accelerates based on audience movement. Still = slow time. Active = fast-forward through day/night cycles.",tags:["timelapse","acceleration","movement","time"]},
{id:31,cat:"art",title:"Generative Music Visualizer — WebGL",desc:"Each audio frequency drives a different generative art algorithm. Bass = geometry, mids = particles, highs = light effects.",tags:["generative","music","webgl","frequency"]},
{id:32,cat:"art",title:"Invisible Sculpture — Light-Only Form",desc:"3D sculpture made entirely of projected light. Walk through it, look around it. Appears solid but is pure light.",tags:["light","sculpture","3d","invisible"]},
{id:33,cat:"art",title:"Memory Wall — Photo Mosaic Timeline",desc:"Upload photos, they arrange into a timeline mosaic on the wall. Zoom into any photo for full view. Years scroll left to right.",tags:["photos","mosaic","timeline","memories"]},
{id:34,cat:"art",title:"Dream Machine — Hypnagogic Visuals",desc:"As you drift to sleep, projections shift into hypnagogic imagery — geometric patterns, faces, landscapes that dissolve and reform.",tags:["dream","hypnagogic","sleep","geometric"]},
{id:35,cat:"art",title:"Ocean Surface Table",desc:"Coffee table becomes a living ocean. Waves respond to objects placed on it. Cup creates ripples, phone creates a sailboat wake.",tags:["ocean","waves","table","reactive"]},
{id:36,cat:"art",title:"Digital Stained Glass",desc:"Window or panel transformed into dynamic stained glass. Light shifts through the day, scenes change, colors blend.",tags:["stained glass","window","light","dynamic"]},
{id:37,cat:"art",title:"Quantum Particle Playground",desc:"Interactive particle system based on quantum physics. Particles exist in superposition until observed, then collapse to a state.",tags:["quantum","particles","physics","interactive"]},
{id:38,cat:"art",title:"Living Wallpaper — Procedural Nature",desc:"Wallpaper that's alive — vines grow, flowers bloom, butterflies fly, seasons change. All procedurally generated, never repeats.",tags:["nature","procedural","wallpaper","living"]},
{id:39,cat:"art",title:"Color organ — Synesthesia Device",desc:"Music becomes color, color becomes sound. Each note triggers a specific hue, each hue generates a tone. Full synesthesia experience.",tags:["synesthesia","color","music","organ"]},
{id:40,cat:"art",title:"Interactive Storybook Floor",desc:"Children's storybook projected on floor. Characters walk, obstacles appear, kids jump/move to interact with the story.",tags:["storybook","floor","children","interactive"]},
{id:41,cat:"art",title:"Cymatics Pattern Generator",desc:"Sound frequencies create cymatics patterns on surfaces. Different frequencies produce different geometric patterns in real-time.",tags:["cymatics","frequency","pattern","sound"]},
{id:42,cat:"art",title:"Virtual Window — Fake View",desc:"Project a fake window view on a blank wall. Ocean, mountain, city, space — change with mood or time of day. Includes weather effects.",tags:["window","view","virtual","ambient"]},
{id:43,cat:"art",title:"Particle Life Simulation",desc:"Emergent behavior simulation where simple particles follow basic rules but create complex life-like patterns. Never the same twice.",tags:["emergent","simulation","particles","life"]},
{id:44,cat:"art",title:"Light Calligraphy — Motion Tracing",desc:"Wave a light wand in the air, projected trails follow your motion creating calligraphy. Save and share your light paintings.",tags:["calligraphy","motion","light","tracing"]},
{id:45,cat:"art",title:"Molecular Structure Visualizer",desc:"Enter a chemical formula, see its 3D molecular structure projected and rotating. Atoms bond, electrons orbit in real-time.",tags:["molecular","chemistry","3d","scientific"]},
{id:46,cat:"art",title:"Voronoi Cracking Surface",desc:"Projected surface that cracks in real-time based on touch/heat/sound. Voronoi patterns spread from impact points like breaking ice.",tags:["voronoi","crack","impact","pattern"]},
{id:47,cat:"art",title:"Lissajous Curve Drawing Machine",desc:"Mathematical Lissajous curves drawn in light across a surface. Parameters adjustable via knobs — watch math become art.",tags:["math","lissajous","curve","drawing"]},
{id:48,cat:"art",title:"Color Field — Rothko Interactive",desc:"Large color field blocks inspired by Rothko. Touch to blend edges, create new colors, shift the emotional tone of the piece.",tags:["rothko","color field","blend","touch"]},
{id:49,cat:"art",title:"Fibonacci Spiral Galaxy",desc:"Fibonacci spiral projected as a galaxy. Stars populate along the spiral arms. Touch to add mass, watch gravity simulate.",tags:["fibonacci","galaxy","spiral","gravity"]},
{id:50,cat:"art",title:"Light Organ — Full Room Immersion",desc:"Entire room becomes a musical instrument. Each wall, ceiling, floor responds to different frequency ranges. Move around to conduct.",tags:["organ","immersive","room","musical"]},

<script>
// Filter logic
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
const totalCount = document.getElementById('total-count');
const showingCount = document.getElementById('showing-count');
const selectedCountEl = document.getElementById('selected-count');
const actionCount = document.getElementById('action-count');
const resultsInfo = document.getElementById('results-info');
const selected = new Set();
let activeCat = 'all';

function catClass(c) {
  const m = {art:'cat-art',gaming:'cat-gaming',events:'cat-events',retail:'cat-retail',edu:'cat-edu',food:'cat-food',home:'cat-home',health:'cat-health',corp:'cat-corp',social:'cat-social',music:'cat-music',arch:'cat-arch',science:'cat-science',security:'cat-security',transport:'cat-transport',fashion:'cat-fashion',industrial:'cat-industrial',environment:'cat-environment',accessibility:'cat-accessibility',sports:'cat-sports',cv:'cat-cv',other:'cat-other'};
  return m[c] || 'cat-other';
}
function catName(c) {
  const m = {art:'Art & Installation',gaming:'Gaming',events:'Events & Weddings',retail:'Retail & E-Commerce',edu:'Education',food:'Food & Beverage',home:'Home & Lifestyle',health:'Health & Medical',corp:'Corporate & Business',social:'Social Media & Content',music:'Music & Audio',arch:'Architecture & Design',science:'Science & Research',security:'Security & Surveillance',transport:'Transportation',fashion:'Fashion & Apparel',industrial:'Industrial & Manufacturing',environment:'Environment & Sustainability',sports:'Sports & Fitness',cv:'Computer Vision & AI',other:'Other'};
  return m[c] || c;
}
function render() {
  const q = search.value.toLowerCase();
  let filtered = CASES.filter(c => {
    if (activeCat !== 'all' && c.cat !== activeCat) return false;
    if (q && !c.title.toLowerCase().includes(q) && !c.desc.toLowerCase().includes(q) && !c.tags.some(t => t.includes(q))) return false;
    return true;
  });
  grid.innerHTML = filtered.map(c => `<div class="card ${selected.has(c.id)?'selected':''}" data-id="${c.id}" onclick="toggle(${c.id})"><div class="check">${selected.has(c.id)?'&#10003;':''}</div><div class="cat ${catClass(c.cat)}">${catName(c.cat)}</div><h3>${c.title}</h3><p>${c.desc}</p><div class="tags">${c.tags.map(t=>'<span class="tag">'+t+'</span>').join('')}</div></div>`).join('');
  empty.style.display = filtered.length ? 'none' : 'block';
  showingCount.textContent = filtered.length;
  if (q) resultsInfo.textContent = `Showing ${filtered.length} results for "${q}"`; else resultsInfo.textContent = '';
}
function toggle(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  selectedCountEl.textContent = selected.size;
  actionCount.textContent = selected.size + ' selected';
  render();
}
function selectAll() {
  const q = search.value.toLowerCase();
  CASES.forEach(c => {
    if (activeCat !== 'all' && c.cat !== activeCat) return;
    if (q && !c.title.toLowerCase().includes(q) && !c.desc.toLowerCase().includes(q) && !c.tags.some(t => t.includes(q))) return;
    selected.add(c.id);
  });
  selectedCountEl.textContent = selected.size;
  actionCount.textContent = selected.size + ' selected';
  render();
}
function clearSelection() {
  selected.clear();
  selectedCountEl.textContent = 0;
  actionCount.textContent = '0 selected';
  render();
}
function exportSelected() {
  const data = CASES.filter(c => selected.has(c.id));
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'selected-use-cases.json';
  a.click();
}
search.addEventListener('input', render);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  });
});
totalCount.textContent = CASES.length;
render();
</script>
